apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-postgres-init"
  labels:
    app: "{{ .Release.Name }}-postgres"
data:
  01-create-auth-db.sh: |
    #!/usr/bin/env sh
    set -eu

    echo "Creating extra MLflow auth database if needed..."

    psql -v ON_ERROR_STOP=1 \
      --username "$POSTGRES_USER" \
      --dbname "$POSTGRES_DB" <<-EOSQL
        CREATE DATABASE "{{ .Values.postgres.authDatabase }}" OWNER "{{ .Values.postgres.user }}";
    EOSQL
